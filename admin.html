<script>

const API_URL = "https://mei-velocity1.onrender.com";

let adminPassword = "";


async function login() {

  const passwordInput = document.getElementById("password");
  const message = document.getElementById("loginMessage");

  const password = passwordInput.value.trim();

  if (!password) {
    message.textContent = "Please enter your password.";
    return;
  }

  try {

    const response = await fetch(
      `${API_URL}/api/bookings`,
      {
        headers: {
          "x-admin-password": password
        }
      }
    );

    if (!response.ok) {
      message.textContent = "Incorrect admin password.";
      return;
    }

    const data = await response.json();

    adminPassword = password;

    document.getElementById("loginBox").style.display = "none";
    document.getElementById("dashboard").style.display = "block";

    displayBookings(data.bookings);

  } catch (error) {

    console.error(error);

    message.textContent =
      "Unable to connect to the MEI Velocity server.";

  }
}


function displayBookings(bookings) {

  const table = document.getElementById("bookingsTable");

  table.innerHTML = "";

  document.getElementById("totalBookings").textContent =
    bookings.length;

  document.getElementById("pendingBookings").textContent =
    bookings.filter(b => b.status === "Pending").length;

  document.getElementById("confirmedBookings").textContent =
    bookings.filter(b => b.status === "Confirmed").length;

  document.getElementById("completedBookings").textContent =
    bookings.filter(b => b.status === "Completed").length;


  bookings.forEach(booking => {

    const row = document.createElement("tr");

    row.innerHTML = `

      <td>
        <strong>${escapeHTML(booking.id)}</strong>
      </td>

      <td>
        ${escapeHTML(booking.name)}
      </td>

      <td>
        ${escapeHTML(booking.phone)}
      </td>

      <td>
        ${escapeHTML(booking.pickup)}
      </td>

      <td>
        ${escapeHTML(booking.dropoff)}
      </td>

      <td>
        ${escapeHTML(booking.date)}
        <br>
        ${escapeHTML(booking.time)}
      </td>

      <td>
        ${escapeHTML(booking.vehicle || "")}
      </td>

      <td>
        ${Number(booking.distance || 0).toFixed(2)} km
      </td>

      <td>
        $${Number(booking.fare || 0).toFixed(2)}
      </td>

      <td>
        ${escapeHTML(booking.payment || "")}
      </td>

      <td>

        <select
          class="status"
          onchange="updateStatus('${booking.id}', this.value)"
        >

          ${statusOption("Pending", booking.status)}
          ${statusOption("Confirmed", booking.status)}
          ${statusOption("Completed", booking.status)}
          ${statusOption("Cancelled", booking.status)}

        </select>

      </td>
    `;

    table.appendChild(row);

  });

}


function statusOption(value, current) {

  return `
    <option
      value="${value}"
      ${value === current ? "selected" : ""}
    >
      ${value}
    </option>
  `;

}


async function updateStatus(id, status) {

  try {

    const response = await fetch(
      `${API_URL}/api/bookings/${encodeURIComponent(id)}/status`,
      {
        method: "PATCH",

        headers: {
          "Content-Type": "application/json",
          "x-admin-password": adminPassword
        },

        body: JSON.stringify({
          status: status
        })
      }
    );

    if (!response.ok) {
      alert("Unable to update booking status.");
      return;
    }

    loadBookings();

  } catch (error) {

    console.error(error);

    alert("Unable to connect to the server.");

  }

}


async function loadBookings() {

  try {

    const response = await fetch(
      `${API_URL}/api/bookings`,
      {
        headers: {
          "x-admin-password": adminPassword
        }
      }
    );

    if (!response.ok) {
      alert("Session expired. Please log in again.");
      logout();
      return;
    }

    const data = await response.json();

    displayBookings(data.bookings);

  } catch (error) {

    console.error(error);

    alert("Unable to connect to the MEI Velocity server.");

  }

}


function logout() {

  adminPassword = "";

  document.getElementById("dashboard").style.display = "none";

  document.getElementById("loginBox").style.display = "block";

  document.getElementById("password").value = "";

  document.getElementById("loginMessage").textContent = "";

}


function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>
