<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MEI Velocity Driver</title>
  <style>
    *{box-sizing:border-box}
    body{font-family:Arial,sans-serif;background:#f4f5f7;margin:0;color:#111}
    .wrap{max-width:520px;margin:auto;padding:18px}
    .card{background:#fff;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #00000012}
    input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:9px;font:inherit;margin:6px 0}
    input{border:1px solid #ccc}
    button{border:0;background:#111;color:#fff;cursor:pointer}
    button:hover{opacity:.92}
    button:disabled{opacity:.6;cursor:not-allowed}
    .status{font-size:20px;font-weight:700}
    .toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .hidden{display:none}
    .success{color:#087b2e}
    .error{color:#b00020}
    .ride-chat{margin-top:18px;padding:14px;border:1px solid #e3e8e0;border-radius:12px;background:#fff}.ride-chat h3{margin:0 0 10px}.chat-notice{display:inline-block;margin-left:7px;padding:4px 8px;border-radius:14px;background:#fff0c2;color:#704d00;font-size:11px}.chat-notice[hidden]{display:none}.chat-notify-button{width:auto;margin:0 0 10px;padding:8px 11px;border:1px solid #dce2d7;background:#f4f7ef;color:#30382d;font-size:12px}.chat-messages{display:flex;flex-direction:column;gap:8px;max-height:240px;min-height:54px;overflow:auto}.chat-message{max-width:88%;padding:9px 11px;border-radius:12px;background:#f1f3ee;overflow-wrap:anywhere;font-size:13px}.chat-message.mine{align-self:flex-end;background:#eaf4c9}.chat-message small{display:block;margin-bottom:3px;color:#697164;font-size:10px}.chat-form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;margin-top:10px}.chat-form input{min-width:0;margin:0;padding:10px}.chat-form button{width:auto;margin:0;padding:0 15px;background:#b3d735;color:#17200a;font-weight:700}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="loginCard">
      <h1>MEI VELOCITY</h1>
      <p>Driver Login</p>

      <input id="phone" type="tel" autocomplete="username" placeholder="Phone number">
      <input id="password" type="password" autocomplete="current-password" placeholder="Password">

      <button id="loginBtn" type="button">Sign in</button>
      <p id="loginMsg"></p>
    </div>

    <div id="app" class="hidden">
      <div class="card">
        <h1 id="driverName">Driver</h1>
        <p id="vehicle"></p>
        <p>Current status: <span class="status" id="status">Offline</span></p>

        <div class="toggle">
          <button id="onlineBtn" type="button">Go Online</button>
          <button id="offlineBtn" type="button">Go Offline</button>
        </div>

        <button id="busyBtn" type="button">Set Busy</button>        <button id="demoGpsBtn" type="button">Start Demo GPS</button>
        <button id="logoutBtn" type="button">Log out</button>
        <p id="msg"></p>
      </div>

      <div class="card">
        <h2>Current Ride</h2>
        <div id="currentRide"><p>No active ride.</p></div>
      </div>

      <div class="card">
        <h2>Ride offers</h2>
        <div id="offersList"><p>No ride offers right now.</p></div>
      </div>
    </div>
  </div>

  <script>

    const API = 'https://mei-velocity1.onrender.com';

    const loginCard = document.getElementById('loginCard');
    const app = document.getElementById('app');
    const phoneInput = document.getElementById('phone');
    const passwordInput = document.getElementById('password');
    const offersList = document.getElementById('offersList');
    const currentRide = document.getElementById('currentRide');

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[character]);
    }

    let driverChatSignature = '';
    let driverChatRideId = '';
    let driverChatHasLoaded = false;
    let driverChatLastSeenId = 0;
    let driverChatUnread = false;
    let driverChatLatestCustomerMessage = null;
    async function loadDriverChat(rideId) {
      const activeToken = localStorage.getItem('meiDriverToken');
      const list = document.getElementById('driverChatMessages');
      if (!activeToken || !list) return;
      const status = document.getElementById('driverChatStatus');
      if (driverChatRideId !== rideId) {
        driverChatRideId = rideId;
        driverChatSignature = '';
        driverChatHasLoaded = false;
        driverChatLastSeenId = 0;
        driverChatUnread = false;
        driverChatLatestCustomerMessage = null;
      }
      try {
        const response = await fetch(`${API}/api/driver/bookings/${encodeURIComponent(rideId)}/messages`, {headers:{Authorization:`Bearer ${activeToken}`}});
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Unable to load messages.');
        const messages = data.messages || [];
        const newest = messages[messages.length - 1];
        const newestCustomerMessage = messages.slice().reverse().find(message => message.senderType === 'customer');
        if (newestCustomerMessage && (!driverChatHasLoaded || Number(newestCustomerMessage.id) > driverChatLastSeenId)) {
          const isNew = !driverChatHasLoaded || Number(newestCustomerMessage.id) > driverChatLastSeenId;
          if (isNew) {
            driverChatUnread = true;
            driverChatLatestCustomerMessage = newestCustomerMessage;
            if (typeof setAppMessage === 'function') setAppMessage(`New customer message: ${newestCustomerMessage.body}`, true);
            if (document.hidden && 'Notification' in window && Notification.permission === 'granted') {
              new Notification('MEI Velocity: new ride message', {body: newestCustomerMessage.body});
            }
          }
        }
        if (newestCustomerMessage && (!driverChatLatestCustomerMessage || Number(newestCustomerMessage.id) >= Number(driverChatLatestCustomerMessage.id))) driverChatLatestCustomerMessage = newestCustomerMessage;
        if (newest) driverChatLastSeenId = Math.max(driverChatLastSeenId, Number(newest.id) || 0);
        driverChatHasLoaded = true;
        const notice = document.getElementById('driverChatNotice');
        if (notice) { notice.hidden = !driverChatUnread; notice.textContent = 'New message'; }
        const signature = messages.map(message => message.id).join(',');
        if (signature !== driverChatSignature) {
          driverChatSignature = signature;
          list.replaceChildren();
          messages.forEach(message => {
            const item = document.createElement('article');
            item.className = 'chat-message' + (message.senderType === 'driver' ? ' mine' : '');
            const sender = document.createElement('small');
            const date = new Date(message.createdAt);
            sender.textContent = `${message.senderType === 'driver' ? 'You' : message.senderName} · ${Number.isNaN(date.getTime()) ? '' : date.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`;
            const body = document.createElement('div'); body.textContent = message.body;
            item.append(sender, body); list.append(item);
          });
          list.scrollTop = list.scrollHeight;
        }
        status.textContent = driverChatUnread && driverChatLatestCustomerMessage
          ? `New message from ${driverChatLatestCustomerMessage.senderName}: ${driverChatLatestCustomerMessage.body}`
          : 'Messages refresh automatically.';
      } catch (error) { status.textContent = error.message; }

      const form = document.getElementById('driverChatForm');
      if (form) form.onsubmit = async event => {
        event.preventDefault();
        const input = document.getElementById('driverChatInput');
        const button = form.querySelector('button');
        const body = input.value.trim();
        if (!body) return;
        button.disabled = true; status.textContent = 'Sending…';
        try {
          const response = await fetch(`${API}/api/driver/bookings/${encodeURIComponent(rideId)}/messages`, {method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${activeToken}`},body:JSON.stringify({body})});
          const data = await response.json();
          if (!response.ok) throw new Error(data.message || 'Unable to send message.');
          input.value = '';
          const currentInput = document.getElementById('driverChatInput');
          if (currentInput) currentInput.value = '';
          const notice = document.getElementById('driverChatNotice');
          if (notice) notice.hidden = true;
          driverChatUnread = false;
          driverChatSignature = ''; await loadDriverChat(rideId);
        } catch (error) { status.textContent = error.message; }
        finally { button.disabled = false; }
      };
    }

    async function enableDriverChatAlerts() {
      const status = document.getElementById('driverChatStatus');
      if (!('Notification' in window)) { status.textContent = 'This browser does not support message alerts.'; return; }
      const permission = await Notification.requestPermission();
      if (permission === 'granted') {
        status.textContent = 'Message alerts are on. Keep the driver page open to receive them.';
        const button = document.getElementById('enableChatAlerts');
        if (button) { button.textContent = 'Alerts are on'; button.disabled = true; }
      } else {
        status.textContent = 'Allow notifications for this site in your browser settings to get message alerts.';
      }
    }

async function loadCurrentRide() {
  const activeToken = localStorage.getItem('meiDriverToken');
  if (!activeToken || !currentRide) return;

  try {
    const response = await fetch(`${API}/api/driver/current-ride`, {
      headers: { Authorization: `Bearer ${activeToken}` }
    });
    const data = await response.json();

    if (!response.ok || !data.success) {
      currentRide.innerHTML = '<p>Unable to load current ride.</p>';
      return;
    }

    if (!data.ride) {
      driverChatSignature = '';
      currentRide.innerHTML = '<p>No active ride.</p>';
      return;
    }

    const ride = data.ride;
    const previousChatInput = document.getElementById('driverChatInput');
    const chatDraft = previousChatInput?.value || '';
    const chatHadFocus = previousChatInput === document.activeElement;
    const chatCursor = previousChatInput?.selectionStart ?? chatDraft.length;
    const nextAction = {
      'Accepted': 'On the Way',
      'On the Way': 'Arrived',
      'Arrived': 'Picked Up',
      'Picked Up': 'Completed'
    }[ride.driverStatus];

    currentRide.innerHTML = `
      <div class="ride-offer">
        <h3>${ride.status === 'Completed' ? 'Latest Completed Ride' : 'Active Ride'}</h3>
        ${ride.status === 'Completed' ? '<p>The ride has ended. You can still read and reply in this chat.</p>' : ''}
        <p><strong>Customer:</strong> ${escapeHtml(ride.name)}</p>
        <p><strong>Phone:</strong> ${escapeHtml(ride.phone)}</p>
        <p><strong>Pickup:</strong> ${escapeHtml(ride.pickup)}</p>
        <p><strong>Dropoff:</strong> ${escapeHtml(ride.dropoff)}</p>
        <p><strong>Date:</strong> ${escapeHtml(ride.date)}</p>
        <p><strong>Time:</strong> ${escapeHtml(ride.time)}</p>
        <p><strong>Vehicle:</strong> ${escapeHtml(ride.vehicle)}</p>
        <p><strong>Distance:</strong> ${escapeHtml(ride.distance)} km</p>
        <p><strong>Fare:</strong> $${escapeHtml(ride.fare)}</p>
        <p><strong>Payment:</strong> ${escapeHtml(ride.payment)}</p>
        <p><strong>Ride status:</strong> <span class="status">${escapeHtml(ride.driverStatus)}</span></p>
        ${nextAction ? `<button onclick="updateRideStatus('${nextAction}')">${nextAction}</button>` : ''}
        <section class="ride-chat"><h3>Message customer <span id="driverChatNotice" class="chat-notice" hidden>New message</span></h3><button id="enableChatAlerts" class="chat-notify-button" type="button" onclick="enableDriverChatAlerts()">Turn on message alerts</button><div id="driverChatMessages" class="chat-messages" aria-live="polite"></div><form id="driverChatForm" class="chat-form"><input id="driverChatInput" maxlength="1000" placeholder="Write a message…" autocomplete="off" required><button type="submit">Send</button></form><p id="driverChatStatus" role="status"></p></section>
      </div>
    `;
    const nextChatInput = document.getElementById('driverChatInput');
    const alertsButton = document.getElementById('enableChatAlerts');
    if (alertsButton && 'Notification' in window && Notification.permission === 'granted') { alertsButton.textContent = 'Alerts are on'; alertsButton.disabled = true; }
    if (alertsButton && !('Notification' in window)) alertsButton.hidden = true;
    if (nextChatInput && chatDraft) {
      nextChatInput.value = chatDraft;
      if (chatHadFocus) {
        nextChatInput.focus({preventScroll:true});
        nextChatInput.setSelectionRange(chatCursor, chatCursor);
      }
    }
    loadDriverChat(ride.id);
  } catch (error) {
    console.error('Unable to load current ride:', error);
  }
}

async function updateRideStatus(newStatus) {
  const activeToken = localStorage.getItem('meiDriverToken');
  if (!activeToken) return;

  try {
    const response = await fetch(`${API}/api/driver/current-ride/status`, {
      method: 'PATCH',
      headers: {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${activeToken}`
      },
      body: JSON.stringify({ status: newStatus })
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      alert(data.message || 'Unable to update ride status.');
      return;
    }

    await me();
    await loadCurrentRide();
    await loadOffers();
  } catch (error) {
    console.error('Ride status update error:', error);
    alert('Unable to update ride status.');
  }
}

async function loadOffers() {
  const activeToken = localStorage.getItem('meiDriverToken');
  if (!activeToken) return;

  try {
    const response = await fetch(`${API}/api/driver/offers`, {
      headers: { Authorization: `Bearer ${activeToken}` }
    });
    const data = await response.json();

    if (!data.success || !offersList) return;

    if (!data.offers.length) {
      offersList.innerHTML = '<p>No ride offers right now.</p>';
      return;
    }

    offersList.innerHTML = data.offers.map(offer => `
      <div class="ride-offer">
        <h3>New Ride</h3>
        <p><strong>Customer:</strong> ${escapeHtml(offer.name)}</p>
        <p><strong>Phone:</strong> ${escapeHtml(offer.phone)}</p>
        <p><strong>Pickup:</strong> ${escapeHtml(offer.pickup)}</p>
        <p><strong>Dropoff:</strong> ${escapeHtml(offer.dropoff)}</p>
        <p><strong>Date:</strong> ${escapeHtml(offer.date)}</p>
        <p><strong>Time:</strong> ${escapeHtml(offer.time)}</p>
        <p><strong>Vehicle:</strong> ${escapeHtml(offer.vehicle)}</p>
        <p><strong>Distance:</strong> ${escapeHtml(offer.distance)} km</p>
        <p><strong>Fare:</strong> $${escapeHtml(offer.fare)}</p>
        <p><strong>Payment:</strong> ${escapeHtml(offer.payment)}</p>
        <div class="offer-buttons">
          <button onclick="acceptOffer('${offer.id}')">Accept Ride</button>
          <button onclick="rejectOffer('${offer.id}')">Reject</button>
        </div>
      </div>
    `).join('');
  } catch (error) {
    console.error('Unable to load ride offers:', error);
  }
}

async function acceptOffer(offerId) {
  try {
    const activeToken = localStorage.getItem('meiDriverToken');
    const response = await fetch(`${API}/api/driver/offers/${offerId}/accept`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${activeToken}` }
    });

    const data = await response.json();
    alert(data.message);

    if (data.success) {
      await me();
      await loadCurrentRide();
      await loadOffers();
    }
  } catch (error) {
    console.error('Accept offer error:', error);
    alert('Unable to accept ride.');
  }
}

async function rejectOffer(offerId) {
  try {
    const activeToken = localStorage.getItem('meiDriverToken');
    const response = await fetch(`${API}/api/driver/offers/${offerId}/reject`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${activeToken}` }
    });

    const data = await response.json();

    if (data.success) {
      await loadOffers();
    } else {
      alert(data.message);
    }
  } catch (error) {
    console.error('Reject offer error:', error);
    alert('Unable to reject ride.');
  }
}

setInterval(() => {
  loadCurrentRide();
  loadOffers();
}, 4000);

    const loginBtn = document.getElementById('loginBtn');
    const loginMsg = document.getElementById('loginMsg');
    const driverName = document.getElementById('driverName');
    const vehicle = document.getElementById('vehicle');
    const status = document.getElementById('status');
    const msg = document.getElementById('msg');
    const onlineBtn = document.getElementById('onlineBtn');
    const offlineBtn = document.getElementById('offlineBtn');
    const busyBtn = document.getElementById('busyBtn');
    const logoutBtn = document.getElementById('logoutBtn');

    let token = localStorage.getItem('meiDriverToken');

    function setLoginMessage(text, ok = false) {
      loginMsg.className = ok ? 'success' : 'error';
      loginMsg.textContent = text;
    }

    function setAppMessage(text, ok = false) {
      msg.className = ok ? 'success' : 'error';
      msg.textContent = text;
    }

    async function login() {
      const phone = phoneInput.value.trim();
      const password = passwordInput.value;

      if (!phone || !password) {
        setLoginMessage('Enter your phone number and password.');
        return;
      }

      loginBtn.disabled = true;
      setLoginMessage('Signing in...', true);

      try {
        const r = await fetch(API + '/api/driver/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({phone, password})
        });

        const d = await r.json();

        if (!r.ok) {
          setLoginMessage(d.message || 'Driver login failed.');
          return;
        }

        token = d.token;
        localStorage.setItem('meiDriverToken', token);
        show(d.driver);
      } catch (error) {
        console.error(error);
        setLoginMessage('Unable to connect to the MEI VELOCITY server.');
      } finally {
        loginBtn.disabled = false;
      }
    }

    async function me() {
      if (!token) return;

      try {
        const r = await fetch(API + '/api/driver/me', {
          headers: {Authorization: 'Bearer ' + token}
        });

        if (!r.ok) {
          logout();
          return;
        }

        const d = await r.json();
        show(d.driver);
      } catch (error) {
        console.error(error);
      }
    }

    function show(driver) {
      loginCard.classList.add('hidden');
      app.classList.remove('hidden');

      driverName.textContent = driver.name || 'Driver';
      vehicle.textContent = (driver.vehicle || '') + (driver.plate ? ' Â· ' + driver.plate : '');
      status.textContent = driver.status || 'Offline';
      setAppMessage('', true);
      loadCurrentRide();
      loadOffers();
    }

    async function setStatus(newStatus) {
      if (!token) {
        logout();
        return;
      }

      try {
        const r = await fetch(API + '/api/driver/status', {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            Authorization: 'Bearer ' + token
          },
          body: JSON.stringify({status: newStatus})
        });

        const d = await r.json();

        if (!r.ok) {
          setAppMessage(d.message || 'Unable to update status.');
          return;
        }

        show(d.driver);
      } catch (error) {
        console.error(error);
        setAppMessage('Unable to connect to the MEI VELOCITY server.');
      }
    }

    function logout() {
      token = null;
      localStorage.removeItem('meiDriverToken');
      location.reload();
    }

    loginBtn.addEventListener('click', login);
    onlineBtn.addEventListener('click', () => setStatus('Online'));
    offlineBtn.addEventListener('click', () => setStatus('Offline'));
    busyBtn.addEventListener('click', () => setStatus('Busy'));
    logoutBtn.addEventListener('click', logout);

    passwordInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') login();
    });

    phoneInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') passwordInput.focus();
    });

    let gpsWatchId = null;
  let lastGpsSentAt = 0;

  async function sendDriverLocation(position) {
    const activeToken = localStorage.getItem('meiDriverToken');
    if (!activeToken) return;

    const now = Date.now();
    if (now - lastGpsSentAt < 5000) return;

    const lat = position.coords.latitude;
    const lng = position.coords.longitude;

    try {
      const response = await fetch(`${API}/api/driver/location`, {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${activeToken}`
        },
        body: JSON.stringify({ lat, lng })
      });

      if (response.ok) {
        lastGpsSentAt = now;
      }
    } catch (error) {
      console.error('Unable to send GPS location:', error);
    }
  }

  function startGpsTracking() {
    if (gpsWatchId !== null || !navigator.geolocation) return;

    gpsWatchId = navigator.geolocation.watchPosition(
      sendDriverLocation,
      error => console.error('GPS error:', error),
      {
        enableHighAccuracy: true,
        maximumAge: 5000,
        timeout: 10000
      }
    );
  }

  let demoGpsTimer = null;
  let demoLat = -17.8252;
  let demoLng = 31.0335;

  async function sendDemoLocation() {
    const activeToken = localStorage.getItem('meiDriverToken');
    if (!activeToken) return;

    try {
      const response = await fetch(`${API}/api/driver/location`, {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${activeToken}`
        },
        body: JSON.stringify({ lat: demoLat, lng: demoLng })
      });

      if (response.ok) {
        demoLng += 0.0003;
      }
    } catch (error) {
      console.error('Unable to send demo GPS:', error);
    }
  }

  function startDemoGps() {
    if (demoGpsTimer !== null) return;

    stopGpsTracking();
    sendDemoLocation();
    demoGpsTimer = setInterval(sendDemoLocation, 5000);

    const button = document.getElementById('demoGpsBtn');
    if (button) button.textContent = 'Stop Demo GPS';
  }

  function stopDemoGps() {
    if (demoGpsTimer !== null) {
      clearInterval(demoGpsTimer);
      demoGpsTimer = null;
    }

    const button = document.getElementById('demoGpsBtn');
    if (button) button.textContent = 'Start Demo GPS';
  }
  function stopGpsTracking() {
    if (gpsWatchId !== null) {
      navigator.geolocation.clearWatch(gpsWatchId);
      gpsWatchId = null;
    }
  }

  document.getElementById('demoGpsBtn')?.addEventListener('click', () => {
    if (demoGpsTimer === null) {
      startDemoGps();
    } else {
      stopDemoGps();
    }
  });
  const originalLoadCurrentRide = loadCurrentRide;
  loadCurrentRide = async function() {
    await originalLoadCurrentRide();

    const activeToken = localStorage.getItem('meiDriverToken');
    if (!activeToken) {
      stopGpsTracking();
      return;
    }

    const rideText = currentRide ? currentRide.textContent : '';
    if (rideText.includes('Active Ride')) {
      startGpsTracking();
    } else {
      stopGpsTracking();
    }
  };
  me();
  </script>
</body>
</html>
