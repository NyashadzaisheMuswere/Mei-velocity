<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEI Velocity Driver</title><style>body{font-family:Arial,sans-serif;background:#f4f5f7;margin:0;color:#111}.wrap{max-width:520px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #00000012}input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:9px;font:inherit;margin:6px 0}input{border:1px solid #ccc}button{border:0;background:#111;color:#fff}.status{font-size:20px;font-weight:700}.toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hidden{display:none}.success{color:#087b2e}.error{color:#b00020}</style></head><body><div class="wrap"><div class="card" id="login"><h1>MEI VELOCITY</h1><p>Driver Login</p><input id="phone" placeholder="Phone number"><input id="password" type="password" placeholder="Password"><button onclick="login()">Sign in</button><p id="loginMsg"></p></div><div id="app" class="hidden"><div class="card"><h1 id="name">Driver</h1><p id="vehicle"></p><p>Current status: <span class="status" id="status">Offline</span></p><div class="toggle"><button onclick="setStatus('Online')">Go Online</button><button onclick="setStatus('Offline')">Go Offline</button></div><button onclick="setStatus('Busy')">Set Busy</button><button onclick="logout()">Log out</button><p id="msg"></p></div><div class="card"><h2>Ride offers</h2><p>No ride offers yet.</p><p>Automatic dispatch will appear here in the next step.</p></div></div></div><script>
const API='https://mei-velocity1.onrender.com';let token=localStorage.getItem('meiDriverToken');
async function login(){const r=await fetch(API+'/api/driver/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:phone.value,password:password.value})});const d=await r.json();if(!r.ok){loginMsg.className='error';loginMsg.textContent=d.message;return}token=d.token;localStorage.setItem('meiDriverToken',token);show(d.driver)}
async function me(){if(!token)return;const r=await fetch(API+'/api/driver/me',{headers:{Authorization:'Bearer '+token}});if(!r.ok)return logout();const d=await r.json();show(d.driver)}
function show(d){login.classList.add('hidden');app.classList.remove('hidden');name.textContent=d.name;vehicle.textContent=d.vehicle+' · '+d.plate;status.textContent=d.status}
async function setStatus(s){const r=await fetch(API+'/api/driver/status',{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({status:s})});const d=await r.json();if(r.ok)show(d.driver);else msg.textContent=d.message}
function logout(){token=null;localStorage.removeItem('meiDriverToken');location.reload()}me();
</script></body></html>
