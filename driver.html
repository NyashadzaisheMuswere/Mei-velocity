<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
 
 <title>MEI Velocity Driver</title>
 <link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>
 <style>
    *{box-sizing:border-box}
   body{
  font-family:Arial,sans-serif;
  background:#f4f5f7;
  margin:0;
  color:#111827;
}

.wrap{
  width:100%;
  max-width:1450px;
  margin:auto;
  padding:24px 32px 40px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:22px;
  box-shadow:0 5px 22px rgba(0,0,0,.07);
  border:1px solid #eceff3;
}

/* =========================================================
   TOP NAVIGATION
========================================================= */

.driver-topbar{
  position:sticky;
  top:0;
  z-index:3000;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;

  width:100%;
  min-height:72px;
  padding:12px 28px;

  background:#0b1220;
  color:#fff;
  box-shadow:0 3px 15px rgba(0,0,0,.18);
}

.driver-brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:max-content;
}

.driver-brand-mark{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;

  border-radius:11px;
  background:#ff7900;

  font-size:18px;
  font-weight:900;
}

.driver-brand-text{
  font-weight:900;
  font-size:18px;
  letter-spacing:.4px;
}

.driver-nav{
  display:flex;
  align-items:center;
  gap:8px;
}

.driver-nav a{
  color:#d9dee7;
  text-decoration:none;
  padding:9px 13px;
  border-radius:9px;
  font-size:14px;
  font-weight:600;
}

.driver-nav a:hover,
.driver-nav a.active{
  background:rgba(255,255,255,.09);
  color:#fff;
}

.driver-controls{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:7px;
  flex-wrap:wrap;
}

.driver-controls button{
  width:auto;
  margin:0;
  padding:9px 12px;
  border-radius:9px;
  font-size:13px;
}

#onlineBtn{
  background:#16a34a;
  color:#fff;
}

#offlineBtn{
  background:#374151;
  color:#fff;
}

#busyBtn{
  background:#f59e0b;
  color:#111;
}

#logoutBtn{
  background:#fff;
  color:#111827;
}

#demoGpsBtn{
  background:#262f3e;
  color:#fff;
}

/* =========================================================
   DRIVER HEADER
========================================================= */

.driver-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  margin-bottom:22px;
}

.driver-profile h1{
  margin:0 0 5px;
  font-size:28px;
}

.driver-profile p{
  margin:0;
  color:#687181;
}

.driver-status-box{
  display:flex;
  align-items:center;
  gap:9px;

  padding:10px 14px;
  border-radius:12px;
  background:#fff7ed;

  font-size:13px;
  font-weight:700;
}

.driver-status-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#ff7900;
}
/* DRIVER RIDE PROGRESS */

.ride-progress{
  margin-top:20px;
}

.progress-steps{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
}

.progress-step{
  text-align:center;
  font-size:12px;
  font-weight:700;
  color:#9ca3af;
}

.progress-step::before{
  content:"";
  display:block;
  height:5px;
  border-radius:999px;
  background:#e5e7eb;
  margin-bottom:7px;
}

.progress-step.done{
  color:#111827;
}

.progress-step.done::before{
  background:#ff7900;
}

.progress-step.current{
  color:#ff7900;
}

.progress-step.current::before{
  background:#ff7900;
}

.progress-next{
  display:flex;
  justify-content:flex-end;
  margin-top:14px;
}

.progress-next button{
  width:auto;
  min-width:170px;
  margin:0;
  padding:12px 20px;
  background:#ff7900;
  color:white;
  font-weight:800;
}

@media(max-width:700px){
  .progress-steps{
    overflow-x:auto;
    grid-template-columns:repeat(5,minmax(100px,1fr));
  }

  .progress-next button{
    width:100%;
  }
}
/* =========================================================
   DASHBOARD
========================================================= */
/* ===============================
   COMPACT CURRENT RIDE
================================ */

.driver-side-column{
  grid-column:1 / -1;
  width:100%;
}

.current-ride-card{
  width:100%;
}

.compact-current-ride{
  width:100%;
}

.compact-ride-summary{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:24px;
  align-items:start;
}

.compact-customer h3{
  margin:0;
  font-size:30px;
  line-height:1.1;
  color:#111827;
}

.compact-phone{
  margin:7px 0 0;
  color:#6b7280;
  font-size:15px;
}

.compact-price{
  text-align:right;
}

.compact-price span{
  display:block;
  color:#6b7280;
  font-size:12px;
  margin-bottom:4px;
}

.compact-price strong{
  font-size:30px;
  color:#ff7900;
}

.compact-route{
  display:grid;
  grid-template-columns:minmax(0,1fr) 45px minmax(0,1fr);
  align-items:center;
  gap:16px;

  margin-top:22px;
  padding:18px 20px;

  border-radius:14px;
  background:#f6f7f9;
}

.compact-route-point{
  min-width:0;
}

.compact-route-point small{
  display:block;
  margin-bottom:5px;

  color:#6b7280;
  font-size:11px;
  font-weight:800;
  letter-spacing:.6px;
  text-transform:uppercase;
}

.compact-route-point strong{
  display:block;
  font-size:16px;
  line-height:1.4;
}

.compact-route-arrow{
  width:42px;
  height:42px;

  display:grid;
  place-items:center;

  border-radius:50%;
  background:#ff7900;
  color:#fff;

  font-size:22px;
  font-weight:800;
}

.compact-action{
  display:flex;
  justify-content:flex-end;
  margin-top:14px;
}

.compact-action button{
  width:auto;
  margin:0;

  padding:11px 20px;

  background:#ff7900;
  color:white;

  font-weight:800;
}

.compact-current-ride .ride-chat{
  margin-top:22px;
  padding-top:20px;

  border-top:1px solid #e5e7eb;
}

@media(max-width:700px){

  .compact-ride-summary{
    grid-template-columns:1fr;
    gap:14px;
  }

  .compact-price{
    text-align:left;
  }

  .compact-route{
    grid-template-columns:1fr;
  }

  .compact-route-arrow{
    transform:rotate(90deg);
  }

  .compact-action button{
    width:100%;
  }
}
.driver-dashboard-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:22px;
  width:100%;
}

.driver-main-column,
.driver-side-column{
  width:100%;
  max-width:none;
  grid-column:1 / -1;
}

.driver-map-card,
.driver-side-column > .card{
  width:100%;
  max-width:none;
}

.driver-main-column{
  display:flex;
  flex-direction:column;
  gap:22px;
}

.driver-side-column{
  display:flex;
  flex-direction:column;
  gap:22px;
}

.section-title{
  margin:0 0 14px;
  font-size:19px;
}

.ride-offer{
  padding:16px;
  border:1px solid #eceff3;
  border-radius:14px;
  margin-top:12px;
}

.ride-offer:first-child{
  margin-top:0;
}

.ride-offer button{
  background:#ff7900;
  color:#fff;
}

.ride-offer .offer-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.ride-offer .offer-buttons button:last-child{

@media(max-width:950px){

  .driver-topbar{

    align-items:flex-start;
    flex-wrap:wrap;

  .driver-nav{

    width:100%;
    overflow-x:auto;

  .driver-dashboard-grid{

  }

  .driver-side-column{

  }
}

@media(max-width:650px){

    padding:12px 15px;

  .driver-brand-text{

  }

  .driver-controls{
    width:100%;
    justify-content:flex-start;
  }

  .driver-controls button{
    flex:1 1 auto;
  }

  .driver-header{
    align-items:flex-start;
    flex-direction:column;
  }

  .card{
    padding:17px;
    border-radius:14px;
  }

<script

<script>

    const API = 'https://mei-velocity1.onrender.com';

    const loginCard = document.getElementById('loginCard');
    const app = document.getElementById('app');
    const phoneInput = document.getElementById('phone');
    const passwordInput = document.getElementById('password');
    const offersList = document.getElementById('offersList');
    const currentRide = document.getElementById('currentRide');

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[character]);
    }

    let driverChatSignature = '';
    let driverChatRideId = '';
    let driverChatHasLoaded = false;
    let driverChatLastSeenId = 0;
    let driverChatUnread = false;
    let driverChatLatestCustomerMessage = null;
    async function loadDriverChat(rideId) {
      const activeToken = localStorage.getItem('meiDriverToken');
      const list = document.getElementById('driverChatMessages');
      if (!activeToken || !list) return;
      const status = document.getElementById('driverChatStatus');
      if (driverChatRideId !== rideId) {
        driverChatRideId = rideId;
        driverChatSignature = '';
        driverChatHasLoaded = false;
        driverChatLastSeenId = 0;
        driverChatUnread = false;
        driverChatLatestCustomerMessage = null;
      }
      try {
        const response = await fetch(`${API}/api/driver/bookings/${encodeURIComponent(rideId)}/messages`, {headers:{Authorization:`Bearer ${activeToken}`}});
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Unable to load messages.');
        const messages = data.messages || [];
        const newest = messages[messages.length - 1];
        const newestCustomerMessage = messages.slice().reverse().find(message => message.senderType === 'customer');
        if (newestCustomerMessage && (!driverChatHasLoaded || Number(newestCustomerMessage.id) > driverChatLastSeenId)) {
          const isNew = !driverChatHasLoaded || Number(newestCustomerMessage.id) > driverChatLastSeenId;
          if (isNew) {
            driverChatUnread = true;
            driverChatLatestCustomerMessage = newestCustomerMessage;
            if (typeof setAppMessage === 'function') setAppMessage(`New customer message: ${newestCustomerMessage.body}`, true);
            if (document.hidden && 'Notification' in window && Notification.permission === 'granted') {
              new Notification('MEI Velocity: new ride message', {body: newestCustomerMessage.body});
            }
          }
        }
        if (newestCustomerMessage && (!driverChatLatestCustomerMessage || Number(newestCustomerMessage.id) >= Number(driverChatLatestCustomerMessage.id))) driverChatLatestCustomerMessage = newestCustomerMessage;
        if (newest) driverChatLastSeenId = Math.max(driverChatLastSeenId, Number(newest.id) || 0);
        driverChatHasLoaded = true;
        const notice = document.getElementById('driverChatNotice');
        if (notice) { notice.hidden = !driverChatUnread; notice.textContent = 'New message'; }
        const signature = messages.map(message => message.id).join(',');
        if (signature !== driverChatSignature) {
          driverChatSignature = signature;
          list.replaceChildren();
          messages.forEach(message => {
            const item = document.createElement('article');
            item.className = 'chat-message' + (message.senderType === 'driver' ? ' mine' : '');
            const sender = document.createElement('small');
            const date = new Date(message.createdAt);
            sender.textContent = `${message.senderType === 'driver' ? 'You' : message.senderName} · ${Number.isNaN(date.getTime()) ? '' : date.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`;
            const body = document.createElement('div'); body.textContent = message.body;
            item.append(sender, body); list.append(item);
          });
          list.scrollTop = list.scrollHeight;
        }
        status.textContent = driverChatUnread && driverChatLatestCustomerMessage
          ? `New message from ${driverChatLatestCustomerMessage.senderName}: ${driverChatLatestCustomerMessage.body}`
          : 'Messages refresh automatically.';
      } catch (error) { status.textContent = error.message; }

      const form = document.getElementById('driverChatForm');
      if (form) form.onsubmit = async event => {
        event.preventDefault();
        const input = document.getElementById('driverChatInput');
        const button = form.querySelector('button');
        const body = input.value.trim();
        if (!body) return;
        button.disabled = true; status.textContent = 'Sending…';
        try {
          const response = await fetch(`${API}/api/driver/bookings/${encodeURIComponent(rideId)}/messages`, {method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${activeToken}`},body:JSON.stringify({body})});
          const data = await response.json();
          if (!response.ok) throw new Error(data.message || 'Unable to send message.');
          input.value = '';
          const currentInput = document.getElementById('driverChatInput');
          if (currentInput) currentInput.value = '';
          const notice = document.getElementById('driverChatNotice');
          if (notice) notice.hidden = true;
          driverChatUnread = false;
          driverChatSignature = ''; await loadDriverChat(rideId);
        } catch (error) { status.textContent = error.message; }
        finally { button.disabled = false; }
      };
    }

    async function enableDriverChatAlerts() {

/* =========================================================
   LOCATION HELPERS
========================================================= */

function validCoordinate(
  value
) {

  return (
    value !== null &&
    value !== undefined &&
    value !== '' &&
    Number.isFinite(
      Number(value)
    )
  );
}


function distanceBetweenPoints(
  first,
  second
) {

  if (
    !first ||
    !second
  ) {
    return Infinity;
  }


  const earthRadius =
    6371000;


  const lat1 =
    first[0] *
    Math.PI / 180;

  const lat2 =
    second[0] *
    Math.PI / 180;

  const deltaLat =
    (
      second[0] -
      first[0]
    ) *
    Math.PI / 180;

  const deltaLng =
    (
      second[1] -
      first[1]
    ) *
    Math.PI / 180;


  const a =
    Math.sin(
      deltaLat / 2
    ) ** 2 +

    Math.cos(lat1) *
    Math.cos(lat2) *

    Math.sin(
      deltaLng / 2
    ) ** 2;


  return (
    earthRadius *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    )
  );
}


/* =========================================================
   ADDRESS FALLBACK
========================================================= */

async function geocodeDriverAddress(
  address
) {

  const query =
    address
      .toLowerCase()
      .includes('harare')

      ? address

      : `${address}, Harare, Zimbabwe`;


  const response =
    await fetch(
      `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(
        query
      )}`
    );


  const data =
    await response.json();


  if (
    !data.length
  ) {
    return null;
  }


  return [
    Number(
      data[0].lat
    ),

    Number(
      data[0].lon
    )
  ];
}


/* =========================================================
   GET PICKUP / DESTINATION COORDINATES
========================================================= */

async function getRideCoordinates(
  ride
) {

  let pickup = null;

  let dropoff = null;


  if (
    validCoordinate(
      ride.pickupLat
    ) &&
    validCoordinate(
      ride.pickupLng
    )
  ) {

    pickup = [
      Number(
        ride.pickupLat
      ),

      Number(
        ride.pickupLng
      )
    ];

  } else {

    pickup =
      await geocodeDriverAddress(
        ride.pickup
      );
  }


  if (
    validCoordinate(
      ride.dropoffLat
    ) &&
    validCoordinate(
      ride.dropoffLng
    )
  ) {

    dropoff = [
      Number(
        ride.dropoffLat
      ),

      Number(
        ride.dropoffLng
      )
    ];

  } else {

    dropoff =
      await geocodeDriverAddress(
        ride.dropoff
      );
  }


  return {
    pickup,
    dropoff
  };
}


/* =========================================================
   MOVE DRIVER MARKER IMMEDIATELY
========================================================= */

function updateDriverOwnPosition(
  lat,
  lng
) {

  if (
    !Number.isFinite(
      Number(lat)
    ) ||
    !Number.isFinite(
      Number(lng)
    )
  ) {
    return;
  }


  latestDriverPosition = [
    Number(lat),
    Number(lng)
  ];


  if (
    !liveDriverMap
  ) {
    return;
  }


  if (
    !liveDriverMarker
  ) {

    liveDriverMarker =
      L.marker(
        latestDriverPosition,
        {
          icon:
            driverMapCarIcon(),

          zIndexOffset:
            1100
        }
      )
        .addTo(
          liveDriverMap
        )
        .bindPopup(
          'You'
        );

  } else {

    liveDriverMarker
      .setLatLng(
        latestDriverPosition
      );
  }
}


/* =========================================================
   DRAW ROAD ROUTE
========================================================= */

async function drawDriverRoadRoute(
  destination
) {

  if (
    !latestDriverPosition ||
    !destination ||
    !liveDriverMap
  ) {
    return;
  }


  const now =
    Date.now();


  const moved =
    distanceBetweenPoints(
      lastRouteDriverPosition,
      latestDriverPosition
    );


  if (
    lastRouteDriverPosition &&
    moved < 35 &&
    now - lastRouteRequestAt <
      12000
  ) {
    return;
  }


  lastRouteRequestAt =
    now;

  lastRouteDriverPosition =
    [
      ...latestDriverPosition
    ];


  try {

    const start =
      latestDriverPosition;


    const response =
      await fetch(

        `https://router.project-osrm.org/route/v1/driving/` +

        `${start[1]},${start[0]};` +

        `${destination[1]},${destination[0]}` +

        `?overview=full&geometries=geojson`

      );


    const data =
      await response.json();


    if (
      data.code !== 'Ok' ||
      !data.routes?.length
    ) {

      throw new Error(
        'Route unavailable.'
      );
    }


    const route =
      data.routes[0];


    const points =
      route.geometry.coordinates
        .map(
          ([lng, lat]) =>
            [lat, lng]
        );


    if (
      liveDriverRoute
    ) {

      liveDriverRoute
        .setLatLngs(
          points
        );

    } else {

      liveDriverRoute =
        L.polyline(
          points,
          {
            color:
              '#ff7900',

            weight:
              6,

            opacity:
              0.92
          }
        )
          .addTo(
            liveDriverMap
          );
    }


    const kilometres =
      route.distance /
      1000;


    const minutes =
      Math.max(
        1,
        Math.round(
          route.duration /
          60
        )
      );


    document.getElementById(
      'driverRouteSummary'
    ).textContent =
      `${minutes} min • ${kilometres.toFixed(
        1
      )} km`;


  } catch (error) {

    console.warn(
      'Could not calculate road route:',
      error
    );


    document.getElementById(
      'driverRouteSummary'
    ).textContent =
      'Route information temporarily unavailable.';
  }
}

async function updateDriverRideMap(
  ride

  latestRideForMap =

      'driverMapCard'
    );


  if (
    !ride ||
    ride.status ===
      'Completed' ||

      'Completed'
  ) {

    mapCard.hidden =
      true;

    return;
  }


  mapCard.hidden =
    false;


  initialiseDriverRideMap();


  setTimeout(
    () =>
      liveDriverMap
        ?.invalidateSize(),
    100
  );


  document.getElementById(
    'driverMapCustomer'
  ).textContent =
    ride.name ||
    'Passenger';


  const coordinates =
    await getRideCoordinates(
      ride
    );


  const pickup =
    coordinates.pickup;

  const dropoff =
    coordinates.dropoff;


  if (
    pickup
  ) {

    if (
      !liveRiderMarker
    ) {

      liveRiderMarker =
        L.marker(
          pickup,
          {
            icon:
              driverMapRiderIcon(),

            zIndexOffset:
              1000
          }
        )
          .addTo(
            liveDriverMap
          )
          .bindPopup(
            'Passenger / pickup'
          );

    } else {

      liveRiderMarker
        .setLatLng(
          pickup
        );
    }
  }


  if (
    dropoff
  ) {

    if (
      !liveDestinationMarker
    ) {

      liveDestinationMarker =
        L.marker(
          dropoff,
          {
            icon:
              driverMapDestinationIcon()
          }
        )
          .addTo(
            liveDriverMap
          )
          .bindPopup(
            'Destination'
          );

    } else {

      liveDestinationMarker
        .setLatLng(
          dropoff
        );
    }
  }


  /* Before passenger pickup:
     navigate to passenger.

     After pickup:
     navigate to destination.
  */

  const passengerCollected =
    ride.driverStatus ===
      'Picked Up';


  currentNavigationTarget =
    passengerCollected
      ? dropoff
      : pickup;


  document.getElementById(
    'driverMapTarget'
  ).textContent =
    passengerCollected

      ? (
          ride.dropoff ||
          'Destination'
        )

      : (
          ride.pickup ||
          'Passenger pickup'
        );


  document.getElementById(
    'driverMapStatus'
  ).textContent =
    passengerCollected

      ? 'Navigating to destination'

      : 'Navigating to passenger';


  /* Use driver GPS returned
     by backend if available */

  if (
    validCoordinate(
      ride.driverLat
    ) &&
    validCoordinate(
      ride.driverLng
    )
  ) {

    updateDriverOwnPosition(
      Number(
        ride.driverLat
      ),

      Number(
        ride.driverLng
      )
    );
  }


  if (
    latestDriverPosition &&
    currentNavigationTarget
  ) {

    await drawDriverRoadRoute(
      currentNavigationTarget
    );


    fitDriverRideMap();

  } else {

    document.getElementById(
      'driverRouteSummary'
    ).textContent =
      'Waiting for your GPS location…';


    if (
      currentNavigationTarget
    ) {

      liveDriverMap.setView(
        currentNavigationTarget,
        16
      );
    }
  }
}

async function acceptOffer(offerId) {

    const activeToken = localStorage.getItem('meiDriverToken');
    const response = await fetch(`${API}/api/driver/offers/${offerId}/accept`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${activeToken}` }
    });

    const data = await response.json();
    alert(data.message);

    if (data.success) {
      await me();
      await loadCurrentRide();
      await loadOffers();
    }
  } catch (error) {
    console.error('Accept offer error:', error);
    alert('Unable to accept ride.');
  }
}

async function rejectOffer(offerId) {

    const activeToken = localStorage.getItem('meiDriverToken');
    const response = await fetch(`${API}/api/driver/offers/${offerId}/reject`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${activeToken}` }
    });

    const data = await response.json();

    if (data.success) {
      await loadOffers();
    } else {
      alert(data.message);
    }
  } catch (error) {
    console.error('Reject offer error:', error);
    alert('Unable to reject ride.');
  }
}

          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({phone, password})
        });

        const d = await r.json();

        if (!r.ok) {
          setLoginMessage(d.message || 'Driver login failed.');
          return;
        }

        token = d.token;
        localStorage.setItem('meiDriverToken', token);
        show(d.driver);
      } catch (error) {
        console.error(error);
        setLoginMessage('Unable to connect to the MEI VELOCITY server.');
      } finally {
        loginBtn.disabled = false;
      }
    }

    async function me() {
      if (!token) return;

      try {
        const r = await fetch(API + '/api/driver/me', {
          headers: {Authorization: 'Bearer ' + token}
        });

        if (!r.ok) {
          logout();
          return;
        }

        const d = await r.json();
        show(d.driver);
      } catch (error) {
        console.error(error);
      }
    }

    function show(driver) {
      loginCard.classList.add('hidden');
      app.classList.remove('hidden');

      driverName.textContent = driver.name || 'Driver';
      vehicle.textContent = (driver.vehicle || '') + (driver.plate ? '  ·  ' + driver.plate : '');
      status.textContent = driver.status || 'Offline';
      setAppMessage('', true);
      loadCurrentRide();
      loadOffers();
    }

    async function setStatus(newStatus) {
      if (!token) {
        logout();
        return;
      }

      try {
        const r = await fetch(API + '/api/driver/status', {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            Authorization: 'Bearer ' + token
          },
          body: JSON.stringify({status: newStatus})
        });

        const d = await r.json();

        if (!r.ok) {
          setAppMessage(d.message || 'Unable to update status.');
          return;
        }

        show(d.driver);
      } catch (error) {
        console.error(error);
        setAppMessage('Unable to connect to the MEI VELOCITY server.');
      }
    }

    function logout() {
      token = null;
      localStorage.removeItem('meiDriverToken');
      location.reload();
    }

    loginBtn.addEventListener('click', login);
    onlineBtn.addEventListener('click', () => setStatus('Online'));
    offlineBtn.addEventListener('click', () => setStatus('Offline'));
    busyBtn.addEventListener('click', () => setStatus('Busy'));
    logoutBtn.addEventListener('click', logout);

    passwordInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') login();
    });

    phoneInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') passwordInput.focus();
    });

    let gpsWatchId = null;
  let lastGpsSentAt = 0;

  async function sendDriverLocation(position) {
    const activeToken = localStorage.getItem('meiDriverToken');
    if (!activeToken) return;

    const now = Date.now();
    if (now - lastGpsSentAt < 3000) return;

    const lat = position.coords.latitude;
    const lng = position.coords.longitude;

    updateDriverOwnPosition(
  lat,
  lng
);
    try {
      const response = await fetch(`${API}/api/driver/location`, {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${activeToken}`
        },
        body: JSON.stringify({ lat, lng })
      });

      if (response.ok) {
        lastGpsSentAt = now;
      }
    } catch (error) {
      console.error('Unable to send GPS location:', error);
    }
  }

  function startGpsTracking() {
    if (gpsWatchId !== null || !navigator.geolocation) return;

    gpsWatchId = navigator.geolocation.watchPosition(
      sendDriverLocation,
      error => console.error('GPS error:', error),
      {
        enableHighAccuracy: true,
        maximumAge: 5000,
        timeout: 10000
      }
    );
  }

  let demoGpsTimer = null;
  let demoLat = -17.8252;
  let demoLng = 31.0335;

  async function sendDemoLocation() {
    const activeToken = localStorage.getItem('meiDriverToken');
    if (!activeToken) return;

    try {
      const response = await fetch(`${API}/api/driver/location`, {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${activeToken}`
        },
        body: JSON.stringify({ lat: demoLat, lng: demoLng })
      });

      if (response.ok) {
        demoLng += 0.0003;
      }
    } catch (error) {
      console.error('Unable to send demo GPS:', error);
    }
  }

  function startDemoGps() {
    if (demoGpsTimer !== null) return;

    stopGpsTracking();
    sendDemoLocation();
    demoGpsTimer = setInterval(sendDemoLocation, 5000);

    const button = document.getElementById('demoGpsBtn');
    if (button) button.textContent = 'Stop Demo GPS';
  }

  function stopDemoGps() {
    if (demoGpsTimer !== null) {
      clearInterval(demoGpsTimer);
      demoGpsTimer = null;
    }

    const button = document.getElementById('demoGpsBtn');
    if (button) button.textContent = 'Start Demo GPS';
  }
  function stopGpsTracking() {
    if (gpsWatchId !== null) {
      navigator.geolocation.clearWatch(gpsWatchId);
      gpsWatchId = null;
    }
  }

  document.getElementById('demoGpsBtn')?.addEventListener('click', () => {
    if (demoGpsTimer === null) {
      startDemoGps();
    } else {
      stopDemoGps();
    }
  });
  const originalLoadCurrentRide = loadCurrentRide;
  loadCurrentRide = async function() {
    await originalLoadCurrentRide();

    const activeToken = localStorage.getItem('meiDriverToken');
    if (!activeToken) {
      stopGpsTracking();
      return;
    }

    const rideText = currentRide ? currentRide.textContent : '';
    if (rideText.includes('Active Ride')) {
      startGpsTracking();
    } else {
      stopGpsTracking();
    }
  };
  me();
  </script>
</body>
