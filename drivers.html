<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEI VELOCITY — Driver Management</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#111}
    .wrap{max-width:1000px;margin:40px auto;padding:0 18px}
    .card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 5px 22px rgba(0,0,0,.08)}
    h1{margin:0 0 6px;font-size:30px}
    .sub{margin:0 0 24px;color:#666}
    label{display:block;font-weight:600;margin:14px 0 6px}
    input,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:15px}
    button{border:0;border-radius:8px;padding:11px 15px;font-weight:600;cursor:pointer}
    .primary{background:#111;color:#fff}
    .secondary{background:#eee;color:#111}
    .danger{background:#b42318;color:#fff}
    .success{color:#147a32;margin:10px 0}
    .error{color:#c52222;margin:10px 0}
    .login{max-width:430px;margin:80px auto}
    .hidden{display:none}
    table{width:100%;border-collapse:collapse;margin-top:24px}
    th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #e5e5e5;vertical-align:middle}
    th{font-size:13px;color:#666}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    .badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eee;font-size:12px}
    .row-msg{margin-top:15px;min-height:20px}
    @media(max-width:700px){
      table,thead,tbody,tr,th,td{display:block}
      thead{display:none}
      tr{padding:14px 0;border-bottom:1px solid #ddd}
      td{border:0;padding:5px 0}
      td:before{content:attr(data-label);display:inline-block;width:90px;font-weight:600;color:#666}
      .actions{margin-top:8px}
    }
  </style>
</head>
<body>
  <div id="loginCard" class="card login">
    <h1>MEI VELOCITY</h1>
    <p class="sub">Driver Management</p>
    <label for="adminPassword">Admin password</label>
    <input id="adminPassword" type="password" autocomplete="current-password">
    <button id="loginBtn" class="primary" style="width:100%;margin-top:16px">Sign in</button>
    <div id="loginMsg" class="row-msg"></div>
  </div>

  <div id="app" class="wrap hidden">
    <div class="card">
      <h1>Driver Management</h1>
      <p class="sub">Add drivers, reset passwords, and manage driver status.</p>

      <h2>Add Driver</h2>
      <label for="name">Name</label>
      <input id="name" autocomplete="name">

      <label for="phone">Phone</label>
      <input id="phone" autocomplete="tel">

      <label for="vehicle">Vehicle</label>
      <input id="vehicle">

      <label for="plate">Plate</label>
      <input id="plate">

      <label for="newPassword">Initial password</label>
      <input id="newPassword" type="password" autocomplete="new-password">

      <button id="addBtn" class="primary" style="margin-top:16px">Add Driver</button>
      <div id="msg" class="row-msg"></div>

      <h2 style="margin-top:32px">Drivers</h2>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Phone</th>
              <th>Vehicle</th>
              <th>Plate</th>
              <th>Status</th>
              <th>Active</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="driverRows"></tbody>
        </table>
      </div>
    </div>
  </div>

<script>
  const API = 'https://mei-velocity1.onrender.com';
  let adminPassword = '';

  const $ = id => document.getElementById(id);

  function showMsg(el, text, ok=false) {
    el.className = ok ? 'success row-msg' : 'error row-msg';
    el.textContent = text;
  }

  async function api(path, options={}) {
    options.headers = Object.assign({}, options.headers || {}, {
      'x-admin-password': adminPassword
    });
    return fetch(API + path, options);
  }

  async function loadDrivers() {
    const r = await api('/api/admin/drivers');
    const d = await r.json();
    if (!r.ok) throw new Error(d.message || 'Unable to load drivers.');

    $('driverRows').innerHTML = d.drivers.map(driver => `
      <tr>
        <td data-label="Name">${escapeHtml(driver.name)}</td>
        <td data-label="Phone">${escapeHtml(driver.phone)}</td>
        <td data-label="Vehicle">${escapeHtml(driver.vehicle || '')}</td>
        <td data-label="Plate">${escapeHtml(driver.plate || '')}</td>
        <td data-label="Status"><span class="badge">${escapeHtml(driver.status)}</span></td>
        <td data-label="Active">${driver.active ? 'Yes' : 'No'}</td>
        <td data-label="Actions">
          <div class="actions">
            <button class="secondary" onclick="resetPassword(${driver.id}, '${jsEscape(driver.name)}')">Reset Password</button>
            ${driver.active
              ? `<button class="danger" onclick="deactivateDriver(${driver.id}, '${jsEscape(driver.name)}')">Deactivate</button>`
              : ''}
          </div>
        </td>
      </tr>
    `).join('');
  }

  async function resetPassword(id, driverName) {
    const password = prompt(`Enter a new password for ${driverName} (minimum 6 characters):`);
    if (password === null) return;

    if (password.length < 6) {
      alert('Password must be at least 6 characters.');
      return;
    }

    const confirmPassword = prompt('Enter the new password again to confirm:');
    if (confirmPassword === null) return;

    if (password !== confirmPassword) {
      alert('Passwords do not match.');
      return;
    }

    const r = await api('/api/admin/drivers/' + id, {
      method: 'PATCH',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({password})
    });

    const d = await r.json();
    if (!r.ok) {
      alert(d.message || 'Password reset failed.');
      return;
    }

    alert('Password reset successfully. The driver can now log in with the new password.');
  }

  async function deactivateDriver(id, driverName) {
    if (!confirm(`Deactivate ${driverName}?`)) return;

    const r = await api('/api/admin/drivers/' + id, {
      method: 'PATCH',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({active:false})
    });

    const d = await r.json();
    if (!r.ok) {
      alert(d.message || 'Unable to deactivate driver.');
      return;
    }

    loadDrivers().catch(e => showMsg($('msg'), e.message));
  }

  $('loginBtn').addEventListener('click', async () => {
    const value = $('adminPassword').value.trim();
    if (!value) {
      showMsg($('loginMsg'), 'Enter the admin password.');
      return;
    }

    adminPassword = value;
    try {
      await loadDrivers();
      $('loginCard').classList.add('hidden');
      $('app').classList.remove('hidden');
    } catch (e) {
      adminPassword = '';
      showMsg($('loginMsg'), e.message);
    }
  });

  $('addBtn').addEventListener('click', async () => {
    const name = $('name').value.trim();
    const phone = $('phone').value.trim();
    const vehicle = $('vehicle').value.trim();
    const plate = $('plate').value.trim();
    const password = $('newPassword').value;

    if (!name || !phone || !vehicle || !plate || !password) {
      showMsg($('msg'), 'Please fill in all driver fields.');
      return;
    }
    if (password.length < 6) {
      showMsg($('msg'), 'Driver password must be at least 6 characters.');
      return;
    }

    const r = await api('/api/admin/drivers', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name, phone, vehicle, plate, password})
    });

    const d = await r.json();
    if (!r.ok) {
      showMsg($('msg'), d.message || 'Unable to add driver.');
      return;
    }

    showMsg($('msg'), 'Driver added successfully.', true);
    $('name').value = '';
    $('phone').value = '';
    $('vehicle').value = '';
    $('plate').value = '';
    $('newPassword').value = '';
    loadDrivers().catch(e => showMsg($('msg'), e.message));
  });

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[ch]));
  }

  function jsEscape(value) {
    return String(value ?? '').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  }
</script>
</body>
</html>
